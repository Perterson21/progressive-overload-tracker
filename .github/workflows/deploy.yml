name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          aws ecr get-login-password --region ap-southeast-2 | sudo docker login --username AWS --password-stdin 277601384541.dkr.ecr.ap-southeast-2.amazonaws.com
          sudo docker pull 277601384541.dkr.ecr.ap-southeast-2.amazonaws.com/progressive-overload-tracker:latest
          sudo docker stop tracker-app || true
          sudo docker rm tracker-app || true
          sudo docker run -d --name tracker-app -p 80:3000 --restart always 277601384541.dkr.ecr.ap-southeast-2.amazonaws.com/progressive-overload-tracker:latest
